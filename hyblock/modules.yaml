# Hyblock 仿真零件库（v5，第 5–6 周）：水力君（双连接件 Hyblock 模块）+ 被动分支件 + 被动脚
#
# 标记：[论文] 取自 Hyon et al., "Hyblock", ICRA 2024 的 Table I / 正文 / Fig. 2（Hyblock-I）
#       [推导] 由论文数值反推
#       [WJ]   WJ 确认的结构（10-26）
#       [假设] 没有出处，量级猜测；有实测时替换
#
# 水力君 [WJ]：中间一个刚体方块，两端各一块铰接的连接板，每块板一个液压关节（每模块 2 个关节）；只有两块板的
#   外面能连接。两轴方向未确认，先按平行（都沿宽度方向）。尺寸与质量未实测，以下为假设；每个关节的力矩、速度、
#   范围照 Hyblock-I [论文]。
# 被动分支件 [WJ 同意新增]：无执行器的方块，六个面都能接，用来做躯干和分支（模块本身只能串成链）。
#
# 坐标约定（每个刚体自己的坐标系）：x = 长度方向，y = 高度（向上），z = 宽度。
# 方块坐标系原点在方块中心；板坐标系原点在铰接轴上，板的外法向 = 板坐标系 +x，转轴 = 板坐标系 z。
# 关节角 θ（论文定义）：θ = 90° 时板垂直于方块（与方块端面贴合）；θ 增大 = 板向方块顶面倒；范围 −30°…150°。
# 关节坐标的正方向 = 伸出侧（力矩上限较大的一侧）。

meta:
  name: suirikun_v5
  unit: SI（m, kg, N, Pa；角度字段用 deg）

# ---- 水力君模块 ----
module:
  block:
    size_m: [0.300, 0.144, 0.100]        # [假设] 长 × 高 × 宽；宽、高与 Hyblock-I 相同
    mass_kg: 4.4                          # [假设] 与 Hyblock-I 本体 A 相同
    com_m: [0.0, 0.0, 0.0]               # [假设]
  plate:
    thickness_m: 0.025                    # [假设] 与 Hyblock-I 板相同
    y_range_m: [-0.030, 0.114]            # 板在板坐标系中的高度范围（铰接轴离板下沿 30 mm，同 Hyblock-I）
    mass_kg: 1.8                          # [假设] 与 Hyblock-I 板 B 相同；模块总质量 4.4 + 2 × 1.8 = 8.0 kg
    com_m: [0.0125, 0.042, 0.0]          # [假设] 板的几何中心（板坐标系）
  hinge_m: [0.150, -0.042, 0.0]           # 前端铰接轴在方块坐标系中的位置（方块端面、离底面 30 mm）；后端关于 yz 平面对称
  # 两个关节：a = 前板 P1，b = 后板 P2。作为子零件时总是用 P1 接父零件（两端对称，不失一般性）

joint:
  effective_lever_m: 0.0423              # [推导] 166 N·m ÷ (8 MPa × 无杆腔面积)
  theta_ref_deg: 90.0
  range_min_deg: -30.0                   # [论文 Table I]（Fig. 2 写 +30°，用 load_spec(range_min_deg=30) 切换）
  range_max_deg: 150.0                   # [论文]

cylinder:
  bore_m: 0.025                          # [论文]
  rod_m: 0.0125                          # [论文]

actuator:
  max_speed_deg_s: 1185.0                # [论文] @ 8 LPM。用常数力臂和缸面积反推 8 LPM 只够约 370 deg/s，两者不一致；
                                         #   默认取论文值，370 deg/s 作敏感性档
  time_constant_s: 0.03                  # [假设] 阀 + 油柱的一阶滞后
  armature: 0.3                          # [假设] 关节等效惯量（kg·m²）。MuJoCo 的软关节限位按有效惯量缩放：0.02 时满力矩
                                         #   顶住限位会压进去 7°、全速撞限位冲过 22°；0.3 时为 0.6° / 6°（10-26 测）

# ---- 被动分支件 [假设] ----
hub:
  size_m: 0.120                          # 立方体边长
  mass_kg: 2.0
  max_count: 4                           # 每个设计最多几个分支件（不计入模块数）

# ---- 被动脚（终端附件，无执行器）[假设] ----
foot:
  radius_m: 0.04                         # 半球形垫，碰撞几何为球
  mass_kg: 0.3
  center_offset_m: 0.0                   # 球心沿安装面外法向的偏移（0 = 球心在安装面上，露出一个半球）

# ---- 并联 [假设] ----
parallel:
  max_count: 2                           # 两个模块同向并联（两个关节各自同步），力矩 ×2×η、质量 ×2，不建闭链
  eta: 0.8

# ---- 仿真设置 [设定] ----
sim:
  timestep_s: 0.01                       # env step = 5 × 0.01 = 0.05 s（与参照域相同）
  n_frames: 5
  solver_iterations: 20                  # RM 的 4 次在 6–8 kg 零件 + 大阻尼下不收敛（随机力矩下 25/52 回合发散），20 次 0/52，耗时 +8%
  init_clearance_m: 0.02                 # 初始时最低点离地高度
  torso_touch_m: 0.005                   # 躯干（根零件的基体）最低角低于此高度 = 触地终止
  floor_friction: 1.0
  self_collision: true                   # 10-28 [WJ 决定]：不相邻的零件之间开启碰撞（父子刚体 = 直接相连的方块、板、脚除外，
                                         #   MuJoCo filterparent）。之前与 RM 相同、零件之间不碰撞：随机设计里 47% 初始姿态就互相穿透
  self_collision_tol_m: 0.005            # 初始姿态零件穿透深度超过它 = 无效设计（kind self_collision；与 RoboGrammar 的 presimulate 相同）

tiers:
  pressure_MPa: [8.0, 14.0, 21.0]        # [论文]
  mass_scale: [0.75, 1.0, 1.5]           # [假设]
  parallel_eta: [1.0, 0.8]               # [假设]
  max_speed_deg_s: [370.0, 1185.0]       # 见 actuator.max_speed_deg_s
  max_modules: 6                         # [假设] 候选 4 / 6 / 8，按随机设计的可走比例定
