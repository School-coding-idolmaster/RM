name: Offline checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked robomorph --help
      - run: uv run --locked python -m train.train_brax --help
      - name: Check training dependency imports (no training)
        run: uv run --locked python -c "from brax.training.agents.sac import train; from brax.training.agents.ppo import train"
